[project]
name = "agent-loop"
version = "0.1.0"
description = "Standalone ReAct agent loop (extracted from SwiftAgent)"
requires-python = ">=3.10"
dependencies = [
    "aiohttp",
    "pyyaml",
    "ddgs",
]

[project.scripts]
agent-loop = "agent_loop.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_loop*"]

[tool.setuptools.package-data]
agent_loop = ["prompt/*.yaml", "tools/*.json", "doc/*"]
