[project]
name = "agent-loop"
version = "0.3.0"
description = "Standalone ReAct agent loop (extracted from SwiftAgent)"
requires-python = ">=3.10"
dependencies = [
    "aiohttp",
    "pyyaml",
    "ddgs",
    "textual",
    "pypdf>=6.18.1",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
]

[project.scripts]
perm = "agent_loop.cli.app:main"
permanent = "agent_loop.cli.app:main"
agent-loop = "agent_loop.cli.app:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_loop*"]

[tool.setuptools.package-data]
agent_loop = ["prompt/*.yaml", "tools/*.json", "plugins/*/SKILL.md", "plugins/*/plugin.json"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
